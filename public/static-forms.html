<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact Netlify</title>
</head>

<body>
    <!-- 
        Fichier statique pour la détection Netlify.
        Correspondance exacte avec les champs React.
        Ne PAS supprimer.
    -->
    <form name="contact-live" netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="contact-live" />
        <input name="bot-field" />

        <input type="text" name="subject" />
        <textarea name="message"></textarea>
        <input type="text" name="firstName" />
        <input type="text" name="lastName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="checkbox" name="wantsVisit" />

        <input type="file" name="cv" />
        <input type="file" name="coverLetter" />
    </form>
</body>

</html>
