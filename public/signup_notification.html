<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Formulaire Inscription (Technique)</title>
</head>

<body>
    <!-- 
      Ce formulaire sert uniquement à déclarer les champs à Netlify 
      pour l'envoi d'emails de notification lors d'une inscription.
    -->
    <form name="nouveau-membre" netlify netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="nouveau-membre" />
        <input type="text" name="prenom" />
        <input type="text" name="nom" />
        <input type="text" name="fonction" />
        <input type="text" name="lien_parente" />
        <input type="email" name="email" />
    </form>
</body>

</html>
