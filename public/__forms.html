<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de contact (Définition Netlify)</title>
</head>
<body>
    <!-- 
        Ce formulaire ne sert qu'à Netlify pour détecter les champs lors du déploiement.
        Il n'est pas affiché aux utilisateurs. 
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="contact" />
        <input name="bot-field" />
        
        <!-- Champs du formulaire React -->
        <input type="text" name="subject" />
        <textarea name="message"></textarea>
        <input type="text" name="firstName" />
        <input type="text" name="lastName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="checkbox" name="wantsVisit" />
        
        <!-- Fichiers -->
        <input type="file" name="cv" />
        <input type="file" name="coverLetter" />
    </form>
</body>
</html>
