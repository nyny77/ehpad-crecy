<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>

<body>
    <!-- Formulaire caché pour que Netlify détecte tous les champs -->
    <form name="contact" netlify action="/contact?success=true" enctype="multipart/form-data">
        <input type="hidden" name="form-name" value="contact" />

        <input type="text" name="firstName" />
        <input type="text" name="lastName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <select name="subject">
            <option value="information">Demande d'information</option>
            <option value="visite">Programmer une visite</option>
            <option value="admission">Dossier d'admission</option>
            <option value="recrutement">Recrutement / Candidature</option>
            <option value="tarifs">Questions sur les tarifs</option>
            <option value="autre">Autre demande</option>
        </select>

        <!-- Champs conditionnels qu'on veut que Netlify reconnaisse -->
        <input type="file" name="cv" />
        <input type="file" name="coverLetter" />

        <textarea name="message"></textarea>
        <input type="checkbox" name="wantsVisit" />

        <button type="submit">Envoyer</button>
    </form>
</body>

</html>
