backend:
  name: git-gateway
  branch: main

local_backend: true



media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "galerie"
    label: "Galerie Photos"
    files:
      - name: "photos"
        label: "Photos"
        file: "src/lib/data/gallery.json"
        fields:
          - { name: "photos", label: "Liste des photos", widget: "list", fields: [
              { name: "id", label: "ID Unique", widget: "string", default: "img-{{now}}" },
              { name: "title", label: "Titre", widget: "string" },
              { name: "category", label: "Catégorie", widget: "select", options: ["chamber", "lounge", "garden", "restaurant", "other", "event", "autre"], default: "other" },
              { name: "src", label: "Image", widget: "image" },
              { name: "alt", label: "Description Alt (Accessibilité)", widget: "string" }
            ]}


  - name: "visite_virtuelle"
    label: "Visite Virtuelle (Photos Maison)"
    files:
      - name: "photos"
        label: "Photos de l'établissement"
        file: "src/lib/data/visite-gallery.json"
        fields:
          - { name: "photos", label: "Liste des photos", widget: "list", fields: [
              { name: "id", label: "ID Unique", widget: "string", default: "img-{{now}}" },
              { name: "title", label: "Titre", widget: "string" },
              { name: "src", label: "Image", widget: "image" },
              { name: "alt", label: "Description Alt (Accessibilité)", widget: "string", required: false }
            ]}

  - name: "recrutement"
    label: "Recrutement"
    files:
      - name: "offres"
        label: "Offres d'Emploi"
        file: "src/lib/data/jobs.json"
        fields:
          - { name: "offers", label: "Liste des offres", widget: "list", fields: [
              { name: "id", label: "ID", widget: "string", default: "job-{{now}}" },
              { name: "title", label: "Titre du poste", widget: "string" },
              { name: "contract", label: "Type de contrat", widget: "string", default: "CDI" },
              { name: "description", label: "Description", widget: "markdown" },
              { name: "requirements", label: "Pré-requis", widget: "list", field: { name: "req", label: "Pré-requis", widget: "string" } }
            ]}

  - name: "gazette"
    label: "Le Petit Écho du Cœur"
    files:
      - name: "latest"
        label: "Dernière Gazette"
        file: "src/lib/data/gazette.json"
        fields:
            - { name: "file", label: "Fichier PDF", widget: "file", allowed_extensions: ["pdf"] }
            - { name: "date", label: "Date de mise en ligne", widget: "datetime" }

  - name: "blog"
    label: "Blog"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["activite", "evenement", "sortie", "fete", "autre"], default: "activite" }
      - { label: "Image principale", name: "image", widget: "image", required: false }
      - { label: "Extrait", name: "excerpt", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }


  - name: "pages"
    label: "Pages du Site"
    files:
      - name: "history"
        label: "Histoire de Crécy"
        file: "src/lib/data/history.json"
        fields:
          - { name: "heroTitle", label: "Titre Principal", widget: "string", default: "Histoire de Crécy-la-Chapelle" }
          - { name: "introText", label: "Texte d'Introduction", widget: "text" }
          - { name: "section1", label: "Section 1: L'Eau", widget: "object", fields: [
              { name: "title", label: "Titre", widget: "string", default: "L'Eau : L'Âme de Crécy" },
              { name: "content", label: "Contenu", widget: "markdown" },
              { name: "image", label: "Photo 1 (Brassets)", widget: "image" },
              { name: "caption", label: "Légende Photo 1", widget: "string" }
            ]}
          - { name: "section2", label: "Section 2: Les Pierres", widget: "object", fields: [
              { name: "title", label: "Titre", widget: "string", default: "Des Pierres qui Racontent une Histoire" },
              { name: "content", label: "Contenu", widget: "markdown" },
              { name: "image", label: "Photo 2 (Remparts)", widget: "image" },
              { name: "caption", label: "Légende Photo 2", widget: "string" }
            ]}
          - { name: "section3", label: "Section 3: La Collégiale", widget: "object", fields: [
              { name: "title", label: "Titre", widget: "string", default: "La Collégiale Notre-Dame" },
              { name: "content", label: "Contenu", widget: "markdown" },
              { name: "image", label: "Photo 3 (Collégiale)", widget: "image" },
              { name: "caption", label: "Légende Photo 3", widget: "string" }
            ]}
          - { name: "section4", label: "Section 4: Coeur de Ville", widget: "object", fields: [
              { name: "title", label: "Titre", widget: "string", default: "Un Cœur de Ville Vivant et Paisible" },
              { name: "content", label: "Contenu", widget: "markdown" },
              { name: "image", label: "Photo 4 (Centre-ville)", widget: "image" },
              { name: "caption", label: "Légende Photo 4", widget: "string" }
            ]}
          - { name: "outro", label: "Mot de la Fin", widget: "markdown" }
