name: Qualité du site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code et les parcours essentiels
        run: npm run check

      - name: Construire le site de production
        run: npm run build

      - name: Installer Chromium pour les parcours automatiques
        run: npx playwright install --with-deps chromium

      - name: Tester Contact, Admission, Administration et Postier
        run: npm run test:e2e
