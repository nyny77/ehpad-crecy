introText: "L'EHPAD de Crécy-la-Chapelle est un établissement public moderne, niché au cœur de la Seine-et-Marne. Ici, nous avons à cœur de créer un véritable foyer pour nos 63 résidents."
quote:
  text: "Chaque résident est unique. Notre mission est de l'accompagner avec dignité, respect et beaucoup d'affection."
  author: "L'équipe de l'EHPAD de Crécy"
